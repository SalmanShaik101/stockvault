<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#050507"/>
  <!-- Geometric translucent overlapping panels inspired by user design -->
  <polygon points="-200,300 700,-300 1300,-300 400,300" fill="url(#glassGrad1)" opacity="0.14"/>
  <polygon points="100,700 1100,-300 1600,-300 600,700" fill="url(#glassGrad2)" opacity="0.18"/>
  <polygon points="-300,900 800,-200 1300,-200 200,900" fill="url(#glassGrad1)" opacity="0.09"/>
  <polygon points="300,950 1400,-150 1800,-150 700,950" fill="url(#glassGrad3)" opacity="0.15"/>
  <polygon points="-100,1000 600,300 1100,300 400,1000" fill="url(#glassGrad2)" opacity="0.08"/>
  <defs>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#CCCCCC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#555555" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glassGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#AAAAAA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#222222" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#444444" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
